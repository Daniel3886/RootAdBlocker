# Web/admin API port (regular HTTP, no privilege issue here)
server.port=8080

# H2 file-based DB so logs/rules survive restarts. Lives next to the jar.
spring.datasource.url=jdbc:h2:file:./data/sinkhole;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Sinkhole-specific settings ---
# Port the raw DNS UDP listener binds to. Must be >1024 on unrooted Termux.
# Redirect real port 53 -> this port at the network level (see README).
sinkhole.listen-port=5300

# Upstream DNS used for anything NOT on the blocklist.
sinkhole.upstream-dns=1.1.1.1

# Path to a hosts-style blocklist directory. Every regular file under it is loaded.
sinkhole.blocklist.dir=blocklist
