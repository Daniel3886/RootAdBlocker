server.port=8080

spring.datasource.url=jdbc:h2:file:./data/sinkhole;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

sinkhole.listen-port=5300
sinkhole.upstream-dns=1.1.1.1
sinkhole.upstream-timeout=3s
sinkhole.worker-threads=4
sinkhole.queue-capacity=1000
sinkhole.blocklist.dir=blocklist
sinkhole.query-log.retention-days=7
sinkhole.query-log.buffer-capacity=10000
