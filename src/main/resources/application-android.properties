# Active with --spring.profiles.active=android.
# Only values that differ from application.properties belong here.

# Rooted device: bind the standard DNS port so clients need no extra setup.
sinkhole.listen-port=53

# Low-spec hardware: fewer threads and a shorter history keep memory and
# storage use down.
sinkhole.worker-threads=2
sinkhole.query-log.retention-days=3
